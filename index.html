<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>chanchán</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antonio:wght@600&display=swap">
<link rel="stylesheet" href="estilo.css">
<script>
  // antes de la primera pintada: si no, se ve un fogonazo de papel al abrir de noche
  try {
    const guardada = localStorage.getItem('chanchan:luz') || localStorage.getItem('tungatunga:luz');
    document.documentElement.dataset.luz = guardada
      || (matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro');
  } catch (e) { document.documentElement.dataset.luz = 'claro'; }
</script>
<body>
<svg id="cinta" aria-hidden="true"></svg>
<header>
  <button id="tocar" title="tocar"></button>
  <div class="marca">
    <h1>Chan<span>chán</span></h1>
    <span class="rayita"></span>
    <span class="nombre">
      <input id="nombre" placeholder="sin título" spellcheck="false" autocomplete="off"
             maxlength="60" aria-label="nombre del tema">
      <button id="abrir" title="abrir otro tema">▾</button>
    </span>
    <button id="enlace" title="copiar un enlace con este tema adentro">copiar enlace</button>
  </div>
</header>
<main>
  <section class="editor">
    <div class="wrap">
      <pre id="hl" aria-hidden="true"></pre>
      <textarea id="src" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
      <div id="vacio" hidden></div>
    </div>
    <div class="abajo">
      <div id="errores"></div>
      <div class="pie">
        <details>
          <summary>ver el strudel que sale de esto</summary>
          <pre id="js"></pre>
        </details>
        <button id="luz" title="papel o tinta">◐</button>
      </div>
    </div>
  </section>
</main>

<script src="https://unpkg.com/@strudel/web@1.3.0"></script>

<!-- Van en este orden y no en otro: son scripts comunes, comparten un solo
     ámbito, y cada uno usa lo que declararon los de arriba. -->
<script src="js/texto.js"></script>       <!-- leer y comparar palabras -->
<script src="js/vocabulario.js"></script> <!-- las tablas del idioma: golpes, notas, instrumentos, cajas y «cómo» -->
<script src="js/color.js"></script>       <!-- de qué color es cada instrumento -->
<script src="js/traductor.js"></script>   <!-- de castellano a strudel -->
<script src="js/editor.js"></script>      <!-- el espejo pintado sobre el textarea, y la vuelta entera -->
<script src="js/cinta.js"></script>       <!-- el marco, el secuenciador de arriba y la aguja de la vuelta -->
<script src="js/reloj.js"></script>       <!-- qué suena ahora, tocar y parar -->
<script src="js/puntos.js"></script>      <!-- los puntitos del margen: callar una línea -->
<script src="js/guardado.js"></script>    <!-- el guardado, el enlace, y lo que se pega -->
<script src="js/deshacer.js"></script>    <!-- el historial -->
<script src="js/oir.js"></script>         <!-- probar un sonido sin cortar lo que está yendo -->
<script src="js/menu.js"></script>        <!-- cambiar una palabra sin teclado -->
<script src="js/seleccion.js"></script>   <!-- editar varias de una vez -->
<script src="js/sugeridor.js"></script>   <!-- autocompletar y sugerir lo que sigue -->
<script src="js/luz.js"></script>         <!-- papel o tinta -->
<script src="js/temas.js"></script>       <!-- la hoja vacía y los temas hechos -->
<script src="js/arranque.js"></script>    <!-- levantar strudel y abrir el tema -->
