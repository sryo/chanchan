<title>chanchán</title>
<!-- El icono es el codo de la cinta, y lo redibuja pintarMarca() con los colores
     del tema abierto; acá va lo que se ve antes de que corra el js —el marcador,
     la vista previa—, que es lo mismo que la página dibuja con la hoja vacía: el
     marco solo, esperando. Por qué va escrito adentro del href y no en un
     archivo, en REGLAS.md. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0,0,16,16'%3E%3Cpath%20d='M4.30,16V8.4A4.10,4.10,0,0,1,8.4,4.30H16'%20fill='none'%20stroke='%238a8069'%20stroke-width='1.60'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antonio:wght@600&display=swap">
<link rel="stylesheet" href="estilo.css">
<script>
  // antes de la primera pintada: si no, se ve un fogonazo de papel al abrir de noche
  try {
    const guardada = localStorage.getItem('chanchan:luz') || localStorage.getItem('tungatunga:luz');
    document.documentElement.dataset.luz = guardada
      || (matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro');
  } catch (e) { document.documentElement.dataset.luz = 'claro'; }
</script>

<svg id="cinta" aria-hidden="true"></svg>
<header>
  <button id="tocar" title="tocar" aria-label="tocar"><svg class="i maciza"><use href="#i-tocar"/></svg></button>
  <div class="marca">
    <h1>chan<span>chán</span></h1>
    <span class="rayita"></span>
    <span class="nombre">
      <input id="nombre" placeholder="sin título" spellcheck="false" autocomplete="off"
             maxlength="60" aria-label="nombre del tema">
      <button id="abrir" title="abrir otro tema" aria-expanded="false" aria-controls="temas"><svg class="i chica"><use href="#i-chevron"/></svg></button>
    </span>
    <button id="enlace" title="copiar un enlace con este tema adentro" aria-label="copiar enlace"><svg class="i"><use href="#i-enlace"/></svg></button>
    <button id="archivo" title="exportar este tema como archivo" aria-label="exportar archivo"><svg class="i"><use href="#i-bajar"/></svg></button>
  </div>
</header>
<main>
  <section class="editor">
    <div class="wrap">
      <pre id="hl" aria-hidden="true"></pre>
      <textarea id="src" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="el tema"></textarea>
      <div id="vacio" hidden></div>
    </div>
    <div class="abajo">
      <div id="errores"></div>
      <div class="pie">
        <details>
          <summary><svg class="i chica"><use href="#i-chevron"/></svg>ver el strudel que sale de esto</summary>
          <pre id="js"></pre>
        </details>
        <button id="luz" title="papel o tinta"><svg class="i"><use href="#i-luz"/></svg></button>
      </div>
    </div>
  </section>
</main>
