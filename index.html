    pintar(marcasActuales);
  });
});
src.addEventListener('mouseleave', () => {
  if (!señalado) return;
  señalado = null; pintar(marcasActuales);
});
// mousedown y no click: hay que ganarle al textarea antes de que mueva el cursor.
// Y además es donde arranca el arrastre: si te movés cambia el valor, si soltás
// sin moverte abre el menú, así el click sigue haciendo lo de siempre.
let arrastre = null;
const UMBRAL = 3;

// soltar Alt sin mover el mouse tiene que limpiar el cursor de resize
addEventListener('keyup', e => { if (e.key === 'Alt') src.style.cursor = ''; });

src.addEventListener('mousedown', e => {
  cerrarMenu();
  if (!e.altKey) {
    // el único click que se intercepta es el de la manija: el resto es del navegador
    const m = tokenEn(e.clientX, e.clientY, true);
    if (m && m.enManija && tieneMenu(m)) { e.preventDefault(); abrirMenu(m); }
    return;
  }
  const t = editable(e.clientX, e.clientY);
  if (!t || !arrastrable(t)) return;
  e.preventDefault();
  const d = datosDe(t);
  arrastre = { t, x: e.clientX, y: e.clientY, movido: false, len: t.len,
               grupo: 'tira' + Date.now(),
               acorde: d.acorde || '',
               base: t.tipo === 'tempo' ? (parseFloat(textoDe(t).replace(',', '.')) || 90)
                 : semiDe(d) };
});

function moverArrastre(dx, dy) {
  const a = arrastre;
  let texto;
  if (a.t.tipo === 'tempo') {
    texto = String(Math.min(400, Math.max(20, Math.round(a.base + dx / 4))));
  } else {
    const semi = Math.min(SEMI_MAX, Math.max(SEMI_MIN, a.base + Math.round(-dy / 10)));
    texto = notaDesdeSemi(semi, a.acorde);
    a.semi = semi;
  }
  if (texto === a.ultimo) return;
  a.ultimo = texto;
  reemplazar({ ...a.t, len: a.len }, texto, a.grupo);   // el token cambia de largo al ganar «sostenido»
  a.len = texto.length;
  // si está sonando ya se escucha en contexto; si no, se oye la nota suelta
  if (!sonando && a.t.tipo !== 'tempo')
    oir({ voces: [{ s: 'piano', note: nombreNota(a.semi, 0) }], dura: .3 });
}

addEventListener('mousemove', e => {
  if (!arrastre) return;
  const dx = e.clientX - arrastre.x, dy = e.clientY - arrastre.y;
  if (!arrastre.movido && Math.hypot(dx, dy) < UMBRAL) return;
  if (!arrastrable(arrastre.t)) return;
  arrastre.movido = true;
  moverArrastre(dx, dy);
});

addEventListener('mouseup', () => { arrastre = null; });
// el botón de la selección abre el menú en su propio mousedown, y este listener
// corre después por burbujeo: sin exceptuarlo cierra lo que aquél acaba de abrir
addEventListener('mousedown', e => {
  if (!menu.contains(e.target) && e.target !== src && e.target !== botonSel) cerrarMenu();
});
addEventListener('keydown', e => { if (e.key === 'Escape') cerrarMenu(); });
src.addEventListener('input', cerrarMenu);

// ---------------------------------------------------------------- la barra lateral
// Se arma sola desde el diccionario, así nunca queda desactualizada.
function insertar(txt) {
  const p = src.selectionStart;
  src.value = src.value.slice(0, p) + txt + src.value.slice(src.selectionEnd);
  src.selectionStart = src.selectionEnd = p + txt.length;
  src.focus();
  registrar(src.value, null);
  actualizar(true);
}

function armarVocabulario() {
  const voc = document.getElementById('voc');
  const items = filas => filas.map(([p, d, cls, receta]) => {
    const oye = receta ? ' data-oir="' + (RECETAS.push(receta) - 1) + '"' : '';
    return '<div class="item" data-ins="' + p + '"' + oye + '><span class="p t-' + (cls || 'texto') + '">' + p +
      '</span><span class="d">' + d + '</span></div>';
  }).join('');
  const bloque = (titulo, filas) => '<h2>' + titulo + '</h2>' + items(filas);
  // 128 instrumentos sueltos serían una guía telefónica: van por familia y plegados
  const grupo = (titulo, filas) =>
    '<details><summary>' + titulo + '</summary>' + items(filas) + '</details>';

  voc.innerHTML =
    '<h2>el molde</h2>' +
    '<div class="molde">la <b>&lt;parte&gt;</b> toca <b>&lt;pasos&gt;</b>, <b>&lt;cómo&gt;</b></div>' +
    '<div class="molde">la banda va a <b>&lt;n&gt;</b> tiempos por minuto</div>' +
    bloque('golpes', Object.entries(SONIDOS).map(([p, [s, d]]) =>
        [p, d, 'sonido', recetaDe('golpe', p)])
      .concat([['-', 'silencio', 'silencio'], ['_', 'sigue sonando', 'silencio']])) +
    bloque('notas', Object.entries(NOTAS).map(([p, n]) =>
        [p, '', 'nota', recetaDe('nota', p)])
      // las alteraciones se oyen contra el do, si no no se entiende medio tono de qué
      .concat([['sostenido', 'medio tono', 'nota', recetaDe('alteracion', 'sostenido')],
               ['bemol',     'medio tono', 'nota', recetaDe('alteracion', 'bemol')]])
      .concat(Object.entries(ACORDES).map(([p, iv]) => [p, iv.length + ' notas juntas', 'nota',
        recetaDe('acorde', p)]))
      .concat(Object.entries(OCTAVAS).map(([p, o]) => [p, 'otra altura', 'nota',
        recetaDe('octava', p)]))) +
    '<h2>instrumentos</h2>' +
    '<div class="molde">el nombre de la parte elige el instrumento</div>' +
    '<div class="molde">pasá el mouse por encima para oírlo</div>' +
    [...FAMILIAS.map(f => f[0]), 'osciladores'].map(fam =>
      grupo(fam, [...new Set(Object.values(INSTRUMENTOS))].filter(i => i.fam === fam)
        .map(i => [i.nombre, i.gm || i.sonido, 'mod',
          // los graves se prueban abajo, si no no se les oye el cuerpo
          recetaDe('instrumento', i.nombre)]))).join('') +
    bloque('cómo', MODIFICADORES.map(m => [m[0], m[2], 'mod'])) +
    '<h2>ejemplos</h2><div class="ejemplos" id="ejemplos"></div>';

  voc.querySelectorAll('.item').forEach(el => {
    el.addEventListener('click', () => insertar(el.dataset.ins + ' '));
    if (el.dataset.oir) alPasar(el);
  });

  const cajaEj = document.getElementById('ejemplos');
  EJEMPLOS.forEach((e, i) => {
    const b = document.createElement('button');
    b.textContent = e.nombre;
    b.addEventListener('click', () => { src.value = e.txt; registrar(src.value, null); actualizar(true); });
    cajaEj.appendChild(b);
  });
}

const MUESTRAS = 'https://raw.githubusercontent.com/felixroos/dough-samples/main/';
const CROMA_GM = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];

// Una muestra cada tres semitonos, de do1 a do7: strudel afina las del medio y no
// se llega a notar. Registrar es instantáneo, cada mp3 baja recién cuando suena.
function muestrario(gm) {
  const m = {};
  for (let semi = 12; semi <= 84; semi += 3) {
    const n = CROMA_GM[semi % 12] + Math.floor(semi / 12);
    m[n] = gm + '-mp3/' + n + '.mp3';
  }
  return m;
}
const MUESTRAS_GM = Object.fromEntries(
  [...new Set(Object.values(INSTRUMENTOS))].filter(i => i.gm)
    .map(i => [i.sonido, muestrario(i.gm)]));

initStrudel({
  prebake: () => Promise.all([
    samples(MUESTRAS + 'tidal-drum-machines.json'),
    samples(MUESTRAS + 'piano.json'),
    samples(MUESTRAS_GM, GM),
  ]).then(() => { motorListo = true; if (!sonando) estado.textContent = 'listo'; })
    .catch(() => { estado.textContent = 'no cargaron los sonidos'; }),
});
